<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Metallic Silver Border Gradient -->
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#475569" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Blue Metallic Inner Ring Gradient -->
    <linearGradient id="blueRing" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Inner Background Gradient -->
    <radialGradient id="innerBg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Beak Gradient -->
    <linearGradient id="beakGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="55%" stop-color="#9ca3af" />
      <stop offset="85%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- White Feathers Gradient -->
    <linearGradient id="whiteFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Black Feathers Gradient -->
    <linearGradient id="blackFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Eye Gradient -->
    <radialGradient id="eyeGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="85%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <!-- Clip Path for Emblem Interior -->
    <clipPath id="emblemClip">
      <circle cx="250" cy="250" r="222" />
    </clipPath>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer Emblem Ring -->
  <circle cx="250" cy="250" r="242" fill="url(#silverRing)" stroke="#1e293b" stroke-width="3" />
  <circle cx="250" cy="250" r="234" fill="url(#blueRing)" stroke="#0f172a" stroke-width="2" />
  <circle cx="250" cy="250" r="214" fill="url(#silverRing)" />
  <circle cx="250" cy="250" r="208" fill="url(#innerBg)" />

  <!-- Eagle Artwork Group -->
  <g clip-path="url(#emblemClip)" filter="url(#shadow)">

    <!-- Dark Lower Neck & Chest Feathers (Back Layer) -->
    <g fill="url(#blackFeather)" stroke="#020617" stroke-width="2.5" stroke-linejoin="round">
      <path d="M 155 245 Q 115 270 80 285 Q 115 290 155 275 Z" />
      <path d="M 160 265 Q 115 305 85 335 Q 125 330 165 295 Z" />
      <path d="M 170 280 Q 125 340 105 380 Q 145 365 180 310 Z" />
      <path d="M 185 295 Q 150 365 140 415 Q 175 390 200 325 Z" />
      <path d="M 205 305 Q 180 390 175 445 Q 210 410 225 335 Z" />
      <path d="M 225 310 Q 215 410 220 475 Q 250 430 255 340 Z" />
      <path d="M 250 315 Q 255 415 268 475 Q 288 420 282 340 Z" />
      <path d="M 275 310 Q 295 405 318 460 Q 328 400 308 330 Z" />
      <path d="M 300 300 Q 335 385 362 430 Q 362 370 330 315 Z" />
      <path d="M 325 285 Q 370 355 402 390 Q 395 335 352 295 Z" />
      <path d="M 345 265 Q 395 320 430 345 Q 418 295 370 270 Z" />
    </g>

    <!-- Mid-Layer White/Grey Neck Plumes -->
    <g fill="url(#whiteFeather)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round">
      <path d="M 165 215 Q 125 230 95 245 Q 130 250 175 235 Z" />
      <path d="M 175 230 Q 135 255 112 280 Q 150 275 188 248 Z" />
      <path d="M 190 240 Q 155 275 140 310 Q 175 295 205 258 Z" />
      <path d="M 210 245 Q 185 290 178 330 Q 208 308 228 262 Z" />
      <path d="M 232 248 Q 220 300 222 345 Q 246 315 255 265 Z" />
      <path d="M 255 248 Q 262 305 274 345 Q 288 308 282 262 Z" />
      <path d="M 280 242 Q 305 295 328 335 Q 332 292 308 250 Z" />
      <path d="M 305 232 Q 345 280 375 315 Q 370 270 332 238 Z" />
      <path d="M 325 218 Q 380 255 418 282 Q 405 240 355 218 Z" />
    </g>

    <!-- Main White Head & Sweeping Crown Feathers -->
    <g fill="url(#whiteFeather)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round">
      <path d="M 118 145
               C 145 75, 230 48, 315 72
               C 375 88, 425 125, 455 162
               Q 415 148, 375 142
               Q 425 165, 468 198
               Q 420 185, 375 178
               Q 422 205, 462 238
               Q 410 222, 360 212
               Q 395 238, 425 265
               Q 365 245, 310 230
               C 265 218, 225 215, 185 215
               L 135 175 Z" />

      <path d="M 210 75 Q 295 75 395 122" fill="none" stroke="#64748b" stroke-width="2" />
      <path d="M 235 98 Q 325 102 425 155" fill="none" stroke="#64748b" stroke-width="2" />
      <path d="M 255 125 Q 345 130 442 188" fill="none" stroke="#64748b" stroke-width="2" />
      <path d="M 250 155 Q 335 165 432 222" fill="none" stroke="#64748b" stroke-width="2" />
    </g>

    <!-- Fierce Brow Ridge & Eye Socket -->
    <path d="M 122 142
             Q 165 130 215 132
             Q 255 134 275 118
             Q 260 155 225 168
             Q 185 175 150 162 Z"
          fill="#090d16" />

    <!-- White Brow Highlight Over Eye -->
    <path d="M 125 138 Q 175 112 255 116 Q 225 135 180 138 Q 150 140 125 138 Z"
          fill="#ffffff" stroke="#0f172a" stroke-width="2" />

    <!-- Glowing Blue Eye -->
    <g>
      <path d="M 182 142 Q 212 132 238 140 Q 222 162 192 158 Q 180 152 182 142 Z"
            fill="url(#eyeGlow)" stroke="#020617" stroke-width="2" />
      <circle cx="211" cy="146" r="6.5" fill="#020617" />
      <circle cx="206" cy="142" r="2.5" fill="#ffffff" />
      <circle cx="215" cy="149" r="1.2" fill="#bae6fd" />
    </g>

    <!-- Hooked Beak -->
    <g stroke="#090d16" stroke-width="2.5" stroke-linejoin="round">
      <path d="M 138 142
               C 95 132, 52 158, 44 205
               C 40 228, 48 248, 62 258
               C 60 235, 72 215, 98 205
               C 135 192, 185 190, 232 195
               C 210 180, 175 172, 148 168
               C 145 156, 142 148, 138 142 Z"
            fill="url(#beakGrad)" />

      <path d="M 138 142
               C 115 138, 92 146, 78 162
               C 96 164, 118 168, 146 170
               C 145 158, 142 148, 138 142 Z"
            fill="#f59e0b" opacity="0.85" />

      <ellipse cx="105" cy="162" rx="6" ry="3" transform="rotate(-18 105 162)" fill="#090d16" />

      <path d="M 88 208
               C 125 195, 180 194, 228 198
               C 195 215, 135 218, 95 214 Z"
            fill="#1e293b" />
    </g>
  </g>

  <!-- Subtle Outer Rim Specular Highlight -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
</svg>
